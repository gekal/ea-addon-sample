# site/ の型・Lint・テスト・ビルドの検証と、GitHub Pages への配信。
# 検証はPRでも動く。配信は master への push のときだけ動く。
name: CI

on:
  push:
    branches: [master]
  pull_request:
  # 手動で流したいとき
  workflow_dispatch:

# 同じブランチへ続けてpushされたら古い実行は打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # プロジェクトページ（https://gekal.github.io/ea-addon-sample/）はサブパス配下に置かれる。
  # 独自ドメインでルート配信にするときは空文字にする。
  NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

defaults:
  run:
    # サイトはリポジトリ直下ではなく site/ にある
    working-directory: site

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 現時点のLTSで検証する。LTSが切り替わったら手動で上げる。
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      # npm ci ではなく npm install を使う。
      # wasm 版の optional な依存（@tailwindcss/oxide-wasm32-wasi など）は
      # ロックファイルを作った環境の npm と runner の npm で解決が食い違い、
      # npm ci が EUSAGE（Missing: @emnapi/... from lock file）で落ちるため。
      # ロックファイルは commit してあり、内容が一致していればそのまま使われる。
      - name: 依存関係をインストール
        run: npm install --no-audit --no-fund

      # tsc は TypeScript 7（@typescript/native）。TS6 比で数倍速い。
      - name: 型チェック
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: テスト
        run: npm test

      - name: 静的書き出し
        run: npm run build

      # _next/ はアンダースコア始まりのため、Jekyll に無視されると CSS も JS も 404 になる
      - name: .nojekyll を置く
        run: touch out/.nojekyll

      - name: 書き出し結果をアップロード
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
